function Chip({ label }) {
  const s = CHIP[label] || { bg:"#f0f0f0", c:"#444" };
  return <span style={{ display:"inline-block", padding:"2px 8px", fontSize:9, letterSpacing:"0.12em", textTransform:"uppercase", background:s.bg, color:s.c, fontFamily:M, fontWeight:500, lineHeight:1.7 }}>{label}</span>;
}

function Fade({ children, d=0 }) {
  const ref = useRef(null);
  const [on, setOn] = useState(false);
  useEffect(() => {
    const ob = new IntersectionObserver(([e]) => { if (e.isIntersecting) setOn(true); }, { threshold:0.05 });
    if (ref.current) ob.observe(ref.current);
    return () => ob.disconnect();
  }, []);
  return <div ref={ref} style={{ opacity:on?1:0, transform:on?"none":`translateY(20px)`, transition:`opacity 0.65s ease ${d}s, transform 0.65s ease ${d}s` }}>{children}</div>;
}

function Modal({ onClose, children }) {
  useEffect(() => { document.body.style.overflow="hidden"; return () => { document.body.style.overflow=""; }; }, []);
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, zIndex:800, background:"rgba(0,0,0,0.6)", display:"flex", alignItems:"center", justifyContent:"center", padding:16, backdropFilter:"blur(4px)" }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:"#fff", width:"100%", maxWidth:700, maxHeight:"90vh", overflowY:"auto" }}>{children}</div>
    </div>
  );
}
